services:
  codia-backend-admin:
    build: .
    container_name: codia-backend-admin
    ports:
      - "8001:8001"
    volumes:
      - ./:/app
    env_file: .env
    depends_on:
      - dev-postgres

  dev-postgres:
    image: postgres:16
    container_name: dev-postgres
    expose:
      - "5432"
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data

volumes:
  dev-postgres-data:
